<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AI 英语口语练习伙伴系统流程图</title>
  <desc id="desc">展示用户、Vue 前端、Spring Boot 后端、MySQL、Redis、DashScope、阿里云 OSS 在口语练习流程中的交互关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#31516f"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#143c5a"/>
      <stop offset="1" stop-color="#226b68"/>
    </linearGradient>
    <style>
      .bg { fill: #f6f8fb; }
      .title { fill: #ffffff; font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .subtitle { fill: #d9edf2; font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .lane-title { fill: #183247; font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .box-title { fill: #102638; font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .box-text { fill: #34495e; font: 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .small { fill: #456174; font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .lane { fill: #ffffff; stroke: #d6e1ea; stroke-width: 1.4; }
      .frontend { fill: #eaf5ff; stroke: #65a5d8; }
      .backend { fill: #edf8f1; stroke: #6ab987; }
      .storage { fill: #fff6df; stroke: #d7a84d; }
      .external { fill: #f7ecff; stroke: #a779c8; }
      .user { fill: #eef1f4; stroke: #8797a3; }
      .line { fill: none; stroke: #31516f; stroke-width: 2.4; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #607d93; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .label { fill: #25445d; font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <rect x="0" y="0" width="1280" height="96" fill="url(#header)"/>
  <text class="title" x="48" y="44">AI 英语口语练习伙伴系统流程图</text>
  <text class="subtitle" x="50" y="73">登录鉴权、场景开场、语音转写、AI 对话、语音合成、对话记忆与总结报告的端到端链路</text>

  <rect class="lane" x="32" y="126" width="180" height="566" rx="12"/>
  <text class="lane-title" x="70" y="158">用户侧</text>

  <rect class="lane" x="238" y="126" width="270" height="566" rx="12"/>
  <text class="lane-title" x="318" y="158">Vue 前端</text>

  <rect class="lane" x="536" y="126" width="310" height="566" rx="12"/>
  <text class="lane-title" x="625" y="158">Spring Boot 后端</text>

  <rect class="lane" x="874" y="126" width="170" height="566" rx="12"/>
  <text class="lane-title" x="921" y="158">数据层</text>

  <rect class="lane" x="1072" y="126" width="176" height="566" rx="12"/>
  <text class="lane-title" x="1116" y="158">外部服务</text>

  <rect class="user" x="58" y="196" width="128" height="70" rx="10"/>
  <text class="box-title" x="88" y="225">学习者</text>
  <text class="box-text" x="79" y="249">登录并练习</text>

  <rect class="frontend" x="270" y="188" width="206" height="86" rx="10"/>
  <text class="box-title" x="320" y="219">登录 / 注册页</text>
  <text class="box-text" x="301" y="244">保存 JWT 到 localStorage</text>

  <rect class="backend" x="574" y="188" width="234" height="86" rx="10"/>
  <text class="box-title" x="632" y="219">用户接口</text>
  <text class="box-text" x="610" y="244">校验账号并签发 JWT</text>

  <rect class="storage" x="902" y="188" width="114" height="86" rx="10"/>
  <text class="box-title" x="936" y="219">MySQL</text>
  <text class="box-text" x="922" y="244">用户数据</text>

  <rect class="frontend" x="270" y="318" width="206" height="98" rx="10"/>
  <text class="box-title" x="318" y="349">训练页</text>
  <text class="box-text" x="296" y="374">选择预设 / 自定义场景</text>
  <text class="box-text" x="306" y="397">生成 sessionId</text>

  <rect class="backend" x="574" y="318" width="234" height="98" rx="10"/>
  <text class="box-title" x="634" y="349">场景开场接口</text>
  <text class="box-text" x="603" y="374">读取缓存或调用 AI</text>
  <text class="box-text" x="615" y="397">返回文本和音频地址</text>

  <rect class="storage" x="902" y="318" width="114" height="98" rx="10"/>
  <text class="box-title" x="938" y="349">Redis</text>
  <text class="box-text" x="920" y="374">开场缓存</text>
  <text class="box-text" x="912" y="397">对话记忆</text>

  <rect class="external" x="1098" y="302" width="124" height="66" rx="10"/>
  <text class="box-title" x="1126" y="330">DashScope</text>
  <text class="box-text" x="1125" y="352">AI 对话</text>

  <rect class="external" x="1098" y="388" width="124" height="66" rx="10"/>
  <text class="box-title" x="1125" y="416">阿里云 OSS</text>
  <text class="box-text" x="1125" y="438">音频文件</text>

  <rect class="frontend" x="270" y="470" width="206" height="108" rx="10"/>
  <text class="box-title" x="318" y="501">录音与确认</text>
  <text class="box-text" x="301" y="526">上传 audioFile</text>
  <text class="box-text" x="296" y="550">编辑并确认识别文本</text>

  <rect class="backend" x="574" y="462" width="234" height="124" rx="10"/>
  <text class="box-title" x="638" y="493">语音与对话接口</text>
  <text class="box-text" x="606" y="518">ASR 转写用户录音</text>
  <text class="box-text" x="601" y="542">AI 生成场景化回复</text>
  <text class="box-text" x="610" y="566">TTS 合成回复语音</text>

  <rect class="frontend" x="270" y="626" width="206" height="50" rx="10"/>
  <text class="box-title" x="318" y="657">总结报告页</text>

  <rect class="backend" x="574" y="620" width="234" height="62" rx="10"/>
  <text class="box-title" x="632" y="647">总结接口</text>
  <text class="box-text" x="603" y="669">读取完整对话并评分</text>

  <line class="line" x1="186" y1="231" x2="270" y2="231"/>
  <text class="label" x="197" y="216">账号密码</text>
  <line class="line" x1="476" y1="231" x2="574" y2="231"/>
  <text class="label" x="499" y="216">/user/login</text>
  <line class="line" x1="808" y1="231" x2="902" y2="231"/>
  <text class="label" x="823" y="216">读写用户</text>

  <line class="line" x1="373" y1="274" x2="373" y2="318"/>
  <text class="label" x="388" y="303">进入训练</text>
  <line class="line" x1="476" y1="367" x2="574" y2="367"/>
  <text class="label" x="492" y="352">/voice/scene-opening</text>
  <line class="dash" x1="808" y1="367" x2="902" y2="367"/>
  <text class="label" x="821" y="352">查缓存</text>
  <line class="dash" x1="808" y1="344" x2="1098" y2="335"/>
  <text class="label" x="901" y="325">未命中时生成开场</text>
  <line class="dash" x1="808" y1="394" x2="1098" y2="421"/>
  <text class="label" x="905" y="430">保存或返回音频 URL</text>

  <line class="line" x1="373" y1="416" x2="373" y2="470"/>
  <text class="label" x="388" y="447">浏览器录音</text>
  <line class="line" x1="476" y1="524" x2="574" y2="524"/>
  <text class="label" x="492" y="508">/voice/transcribe</text>
  <line class="dash" x1="808" y1="516" x2="1098" y2="335"/>
  <text class="label" x="922" y="500">ASR / AI</text>
  <line class="line" x1="476" y1="556" x2="574" y2="556"/>
  <text class="label" x="493" y="582">/voice/text-chat</text>
  <line class="dash" x1="808" y1="554" x2="902" y2="390"/>
  <text class="label" x="820" y="486">写入记忆</text>
  <line class="dash" x1="808" y1="566" x2="1098" y2="421"/>
  <text class="label" x="912" y="568">TTS 音频</text>

  <line class="line" x1="373" y1="578" x2="373" y2="626"/>
  <text class="label" x="388" y="607">结束练习</text>
  <line class="line" x1="476" y1="651" x2="574" y2="651"/>
  <text class="label" x="492" y="636">/voice/summary</text>
  <line class="dash" x1="808" y1="650" x2="902" y2="398"/>
  <text class="label" x="821" y="625">读取对话</text>
  <line class="dash" x1="808" y1="632" x2="1098" y2="335"/>
  <text class="label" x="913" y="635">总结评分</text>

  <text class="small" x="48" y="724">说明：JWT 负责用户身份，sessionId 负责区分每一次练习会话；Redis 同时承担预设开场缓存和会话级对话记忆。</text>
</svg>
