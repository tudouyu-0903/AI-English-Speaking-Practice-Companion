spring:
  application:
    name: AiEnglishSpeakingPracticeCompanion
  profiles:
    active: local
  ai:
    dashscope:
      chat:
        options:
          model: qwen3.5-plus
  data:
    redis:
      database: 3
server:
  port: 8080
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.cxy.aiprreview.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
